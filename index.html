<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <!-- font -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&family=Special+Elite&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <!-- body icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check_circle_unread" />
  <!-- title icon -->
  <link rel = "icon" type="image/x-icon" href="https://media.istockphoto.com/id/1492219036/vector/illustration-of-a-friendly-cute-cartoon-bee-flying-and-smiling.jpg?s=1024x1024&w=is&k=20&c=cNL_gt-cAsObrBJQ7Pbp1TCx_8iRBVQxsXL3mFbgd0o=">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id= "title" >Habit Tracker</h1>
    <div id="emptyState">

    Start building your future one habit at a time 🌱

    </div>
<div class="weekControls">
<button id="prevWeekBtn">← Previous</button>

<button id="todayBtn">Today</button>

<button id="nextWeekBtn">Next →</button>
</div>
<h3 id="weekLabel"></h3>
    <div class="controls" ><button id="addHabitBtn">Add habit</button><input 
      id="habitInput" type="text" 
      placeholder="Write a habit">
      <!-- <input type="week"> -->
    </div>
    <audio id="successSound" src="dragon-studio-pop.mp3"></audio>
  
  
    <div class = "chart">
    <div class = "containerGrid" id="containerGrid">
    <!-- Headings Row -->
      <div class="col-habit"><h3><u>Habits</u></h3></div>
      <div class="streak">🔥</div>
    <div class="days"><b>Monday</b></div>
    <div class="days"><b>Tuesday</b></div>
    <div class="days"><b>Wednesday</b></div>
    <div class="days"><b>Thursday</b></div>
    <div class="days"><b>Friday</b></div>
    <div class="days"><b>Saturday</b></div>
    <div class="days"><b>Sunday</b></div>
     
    </div>

</div>
  <script src="script1.js"></script>
</body>
</html>
